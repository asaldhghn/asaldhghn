name: Update dashboard

on:
  schedule:
    - cron: "17 5 * * *"      # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dashboard
        env:
          # Add a repo secret GH_PAT (a token with read:user) so private contribution counts are included.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/build-dashboard.mjs assets/dashboard.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          git diff --cached --quiet || (git commit -m "Update dashboard" && git push)
